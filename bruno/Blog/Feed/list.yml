info:
  name: Published posts as an infinite scroll
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/v1/feed?pageSize=2"
  auth:
    type: bearer
    token: "{{alice}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Send the nextCursor back as ?cursor=.
