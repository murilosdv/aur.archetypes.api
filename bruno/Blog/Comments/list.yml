info:
  name: Comments as an infinite scroll
  type: http
  seq: 4

http:
  method: GET
  url: "{{host}}/v1/posts/{{commentsPostId}}/comments?pageSize=2"
  auth:
    type: bearer
    token: "{{alice}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Send the nextCursor of the answer back as ?cursor=.
