info:
  name: Alice reports the comment
  type: http
  seq: 5

http:
  method: POST
  url: "{{host}}/v1/posts/{{commentsPostId}}/comments/{{commentId}}/report"
  headers:
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: report-{{$guid}}
  body:
    type: json
    data: '{ "reason": "Rude to other readers" }'
  auth:
    type: bearer
    token: "{{alice}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "202"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "The moderators receive an email with the post, the comment, its author and the reason: read it in the Mailpit of the dev-sbx (http://127.0.0.1:8025). The report is kept even when the mail server is down."
