info:
  name: "Setup: bob publishes it"
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/v1/posts/{{commentsPostId}}/publish"
  auth:
    type: bearer
    token: "{{bob}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
