info:
  name: An admin deletes the comment
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{host}}/v1/posts/{{commentsPostId}}/comments/{{commentId}}"
  auth:
    type: bearer
    token: "{{bob}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
