info:
  name: A reader cannot delete
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{host}}/v1/posts/{{postId}}"
  auth:
    type: bearer
    token: "{{alice}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
