info:
  name: Filtered and ordered by author
  type: http
  seq: 7

http:
  method: GET
  url: "{{host}}/v1/posts?author=bob&orderBy=author:desc"
  auth:
    type: bearer
    token: "{{alice}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
