info:
  name: Alice cannot see the draft
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/v1/posts/{{slug}}"
  auth:
    type: bearer
    token: "{{alice}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: A draft is a 404 for anyone but its author and admins.
