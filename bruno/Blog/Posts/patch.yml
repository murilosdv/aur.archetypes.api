info:
  name: Bob changes only the title
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{host}}/v1/posts/{{postId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{ "title": "Hello, world (edited)" }'
  auth:
    type: bearer
    token: "{{bob}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "A PATCH: what is not sent stays, and so does the slug."
