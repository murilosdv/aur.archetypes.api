info:
  name: A reader cannot write
  type: http
  seq: 4

http:
  method: POST
  url: "{{host}}/v1/posts"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{ "title": "Not allowed", "body": "Readers do not write." }'
  auth:
    type: bearer
    token: "{{alice}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
