info:
  name: Role admin, as a reader
  type: http
  seq: 5

http:
  method: GET
  url: "{{host}}/v1/playground/auth/role"
  auth:
    type: bearer
    token: "{{alice}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
