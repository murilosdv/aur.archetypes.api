info:
  name: Authenticated, with a token
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/v1/playground/auth/authenticated"
  auth:
    type: bearer
    token: "{{bob}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Lists your claims: handy to see how Keycloak sends roles and scopes."
