info:
  name: Authenticated, without a token
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/v1/playground/auth/authenticated"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
