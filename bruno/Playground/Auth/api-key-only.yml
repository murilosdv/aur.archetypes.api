info:
  name: API key only
  type: http
  seq: 10

http:
  method: GET
  url: "{{host}}/v1/playground/auth/api-key-only"
  headers:
    - name: X-Api-Key
      value: "{{apiKey}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
