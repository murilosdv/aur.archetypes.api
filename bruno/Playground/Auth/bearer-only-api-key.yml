info:
  name: Bearer only, with an API key
  type: http
  seq: 12

http:
  method: GET
  url: "{{host}}/v1/playground/auth/bearer-only"
  headers:
    - name: X-Api-Key
      value: "{{apiKey}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
