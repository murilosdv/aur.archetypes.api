info:
  name: "Either: a wrong API key"
  type: http
  seq: 9

http:
  method: GET
  url: "{{host}}/v1/playground/auth/either"
  headers:
    - name: X-Api-Key
      value: wrong-key

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
