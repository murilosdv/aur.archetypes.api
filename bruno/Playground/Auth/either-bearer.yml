info:
  name: "Either: a bearer token"
  type: http
  seq: 8

http:
  method: GET
  url: "{{host}}/v1/playground/auth/either"
  auth:
    type: bearer
    token: "{{alice}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
