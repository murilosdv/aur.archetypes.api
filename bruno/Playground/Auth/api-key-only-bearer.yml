info:
  name: API key only, with a bearer token
  type: http
  seq: 11

http:
  method: GET
  url: "{{host}}/v1/playground/auth/api-key-only"
  auth:
    type: bearer
    token: "{{alice}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
