info:
  name: Output cache
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/v1/playground/caching/timestamp"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Policy short, 10 seconds: the timestamp stays the same for 10 seconds."
