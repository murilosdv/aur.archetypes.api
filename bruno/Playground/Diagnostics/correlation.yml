info:
  name: Correlation id is echoed
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/v1/playground/diagnostics/correlation"
  headers:
    - name: Correlation-Id
      value: my-test-correlation-id

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
