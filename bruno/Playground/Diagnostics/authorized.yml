info:
  name: Authorization, without a token
  type: http
  seq: 4

http:
  method: GET
  url: "{{host}}/v1/playground/diagnostics/authorized"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
