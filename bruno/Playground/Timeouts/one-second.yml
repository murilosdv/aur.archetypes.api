info:
  name: One second
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/v1/playground/timeouts/1"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
