info:
  name: Five seconds
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/v1/playground/timeouts/5"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "504"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: 504 after about 2 seconds (not enforced while debugging).
