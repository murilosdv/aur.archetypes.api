info:
  name: Status, without a token
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}/health/status"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
