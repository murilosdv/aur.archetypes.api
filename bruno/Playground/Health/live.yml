info:
  name: Live
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/health/live"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Name and version. Check X-Content-Type-Options, X-Frame-Options and Referrer-Policy on the response.
