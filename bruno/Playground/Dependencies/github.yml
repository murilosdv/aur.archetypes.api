info:
  name: Typed client (GitHub)
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/v1/playground/dependencies/github/octocat"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: 200 with the user, 404 for an unknown one.
