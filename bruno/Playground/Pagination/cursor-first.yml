info:
  name: "Cursor: first page"
  type: http
  seq: 4

http:
  method: GET
  url: "{{host}}/v1/playground/pagination/people/stream?pageSize=10&orderBy=name:desc"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("cursor", res.body.nextCursor);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Keeps nextCursor for the next request (same filters and ordering).
