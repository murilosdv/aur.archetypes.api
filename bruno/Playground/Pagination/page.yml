info:
  name: Second page
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/v1/playground/pagination/people?page=2&pageSize=5&orderBy=name:desc&orderBy=id"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Second page of 5, ordered by name descending then id.
